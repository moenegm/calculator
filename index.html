<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A browser calculator built with vanilla JavaScript." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="main.css" />
    <title>Calculator</title>
  </head>
  <body>
    <main class="page">
      <h1 class="title">Calculator</h1>

      <div class="calculator" role="application" aria-label="Calculator">
        <div class="display">
          <div class="history" id="history" aria-live="polite"></div>
          <output class="output" id="output" aria-live="polite">0</output>
        </div>

        <div class="keys">
          <button class="key key--fn" data-action="clear">C</button>
          <button class="key key--fn" data-action="delete" aria-label="Delete">&#9003;</button>
          <button class="key key--fn" data-action="percent">%</button>
          <button class="key key--op" data-op="/" aria-label="Divide">&divide;</button>

          <button class="key" data-digit="7">7</button>
          <button class="key" data-digit="8">8</button>
          <button class="key" data-digit="9">9</button>
          <button class="key key--op" data-op="*" aria-label="Multiply">&times;</button>

          <button class="key" data-digit="4">4</button>
          <button class="key" data-digit="5">5</button>
          <button class="key" data-digit="6">6</button>
          <button class="key key--op" data-op="-" aria-label="Subtract">&minus;</button>

          <button class="key" data-digit="1">1</button>
          <button class="key" data-digit="2">2</button>
          <button class="key" data-digit="3">3</button>
          <button class="key key--op" data-op="+" aria-label="Add">+</button>

          <button class="key key--fn" data-op="^" aria-label="Power">x<sup>y</sup></button>
          <button class="key" data-digit="0">0</button>
          <button class="key" data-action="decimal">.</button>
          <button class="key key--equals" data-action="equals">=</button>
        </div>
      </div>

      <p class="hint">Works with your keyboard too: digits, + − * / ^ %, Enter, Backspace, Esc.</p>
    </main>
    <script src="main.js"></script>
  </body>
</html>
